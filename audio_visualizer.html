<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synesthesia Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2fe; --panel: rgba(5, 5, 5, 0.95); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'DM Sans', sans-serif;
            color: white;
        }
        
        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 1; 
            display: block;
        }

        #ui-layer { position: relative; z-index: 10; height: 100vh; pointer-events: none; width: 100%; }
        
        /* Restored Landing Page Style */
        #landing {
            position: fixed; inset: 0; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
            background: black;
            z-index: 100;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: all;
        }

        .title {
            font-family: 'Space Mono';
            font-size: 5vw;
            letter-spacing: .25em;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .cards { display: flex; gap: 25px; }

        .card {
            width: 180px; height: 180px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: .25s;
            background: rgba(255,255,255,.04);
            font-size: 1.1rem;
            text-align: center;
            line-height: 1.6;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,.08);
            border-color: white;
        }

        /* Controller Styles */
        #controller {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--panel); border: 1px solid #333; border-radius: 50px;
            display: flex; align-items: center; padding: 12px 30px; gap: 25px;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: all; backdrop-filter: blur(20px);
        }

        #controller.minimized { width: 60px; height: 60px; padding: 0; gap: 0; border-radius: 50%; justify-content: center; }
        #controller.minimized .hide-on-min { display: none; }

        .status-dot {
            width: 18px; height: 18px; background: var(--accent); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 20px var(--accent);
        }

        .info-text { font-family: 'Space Mono'; font-size: 10px; color: #aaa; white-space: nowrap; font-weight: 700; }
        #fileInput { display: none; }
        .hidden { opacity: 0; pointer-events: none !important; }

    </style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui-layer">
    <div id="landing">
        <div class="title">Synesthesia</div>
        <div class="cards">
            <div class="card" onclick="app.initAudio('mic')">
                🎙️<br>Microphone
            </div>
            <div class="card" onclick="document.getElementById('fileInput').click()">
                🎵<br>Upload Track
            </div>
        </div>
    </div>

    <div id="controller">
        <div class="status-dot" onclick="app.toggleUI()"></div>
        <div class="hide-on-min info-text" id="track-display">ANALYZER_OFFLINE</div>
        <button class="hide-on-min" style="padding: 8px 20px; background: transparent; border: 1px solid #444; color: white; cursor: pointer; border-radius: 20px; font-family: 'Space Mono'; font-size: 10px;" id="pause-btn" onclick="app.togglePlayback()">PAUSE</button>
        <div class="hide-on-min info-text" id="mode-display" style="color: var(--accent);">SCENE: INITIALIZING</div>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/*">

<script id="vs" type="x-shader/x-vertex">
    attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }
</script>

<script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform float u_time, u_bass, u_mid, u_high, u_beat, u_transition;
    uniform int u_currMode, u_nextMode;
    uniform vec2 u_res;

    mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

    vec3 spectral(float t) {
        vec3 a = vec3(0.5);
        vec3 b = vec3(0.5);
        vec3 c = vec3(1.0);
        vec3 d = vec3(0.0, 0.33, 0.67);
        return a + b * cos(6.28318 * (c * t + d));
    }

    float sdOctahedron(vec3 p, float s) {
        p = abs(p);
        return (p.x + p.y + p.z - s) * 0.57735027;
    }

    float map(vec3 p, int mode) {
        float d = 1000.0;
        if (mode == 0) { // PRISM VOID
            p.z += u_time * 1.5;
            p.xy *= rot(p.z * 0.2 + u_time * 0.1);
            vec3 q = mod(p, 8.0) - 4.0;
            for(int i=0; i<5; i++) {
                q = abs(q) - 1.2;
                q.xz *= rot(u_time * 0.3 + u_bass);
                q.xy *= rot(u_mid * 0.5);
                q *= 1.3;
            }
            d = sdOctahedron(q, 1.0 + u_bass * 2.0) * 0.05;
        } 
        else if (mode == 1) { // KINETIC CUBES
            p.xz *= rot(u_time * 0.4);
            p.yz *= rot(u_time * 0.25);
            vec3 q = mod(p, 7.0) - 3.5; 
            vec3 id = floor(p/7.0);
            q.xy *= rot(u_time + length(id));
            q.zy *= rot(u_time * 0.8 + u_beat);
            d = (length(max(abs(q)-vec3(0.8 + u_bass), 0.0)));
        }
        else { // SPECTRAL PLASMA LATTICE
            p.z += u_time * 1.0;
            p.xy *= rot(sin(u_time * 0.2));
            vec3 q = abs(mod(p, 4.0) - 2.0);
            for(int i=0; i<3; i++) {
                q = abs(q) - 0.5;
                q.xy *= rot(u_time * 0.4);
                q *= 1.6 + u_bass * 0.2;
            }
            d = length(q.xz) - (0.1 + u_mid * 0.8);
        }
        return d;
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - u_res.xy) / min(u_res.x, u_res.y);
        vec3 ro = vec3(0, 0, -6);
        vec3 rd = normalize(vec3(uv, 1.0 + u_bass * 0.5));
        float t = 0.0, d = 0.0;
        for(int i=0; i<120; i++) {
            vec3 p = ro + rd * t;
            float d1 = map(p, u_currMode);
            float d2 = map(p, u_nextMode);
            d = mix(d1, d2, u_transition);
            if(abs(d) < 0.001 || t > 60.0) break;
            t += d;
        }
        vec3 col = vec3(0);
        if(t < 60.0) {
            float grad = t * 0.05 + u_time * 0.1;
            col = mix(spectral(grad), spectral(grad + 0.5), u_transition);
            col *= exp(-t * 0.08); 
            col += (u_high * 0.4) / (t * 0.5); 
            col += spectral(u_time * 0.5) * (0.02 / d);
        }
        col.r = mix(col.r, spectral(u_time).r, u_beat * 0.2);
        gl_FragColor = vec4(smoothstep(-0.1, 1.1, col), 1.0);
    }
</script>

<script>
class VJSystem {
    constructor() {
        this.canvas = document.getElementById('gl');
        this.gl = this.canvas.getContext('webgl');
        this.state = { 
            bass:0, mid:0, high:0, beat:0, 
            currMode: 0, nextMode: 0, transition: 1.0,
            startTime: Date.now() 
        };
        this.initGL();
        this.bindEvents();
        this.resize();
        this.render = this.render.bind(this);
        requestAnimationFrame(this.render);
        setInterval(() => this.triggerTransition(), 10000);
    }

    initGL() {
        const prog = this.gl.createProgram();
        const compile = (t, s) => {
            const sh = this.gl.createShader(t);
            this.gl.shaderSource(sh, s);
            this.gl.compileShader(sh);
            this.gl.attachShader(prog, sh);
        };
        compile(this.gl.VERTEX_SHADER, document.getElementById('vs').text);
        compile(this.gl.FRAGMENT_SHADER, document.getElementById('fs').text);
        this.gl.linkProgram(prog);
        this.gl.useProgram(prog);
        this.prog = prog;

        this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.gl.createBuffer());
        this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), this.gl.STATIC_DRAW);
        const p = this.gl.getAttribLocation(prog, "pos");
        this.gl.enableVertexAttribArray(p);
        this.gl.vertexAttribPointer(p, 2, this.gl.FLOAT, false, 0, 0);

        this.uni = {
            t: this.gl.getUniformLocation(prog, "u_time"),
            r: this.gl.getUniformLocation(prog, "u_res"),
            b: this.gl.getUniformLocation(prog, "u_bass"),
            m: this.gl.getUniformLocation(prog, "u_mid"),
            h: this.gl.getUniformLocation(prog, "u_high"),
            bt: this.gl.getUniformLocation(prog, "u_beat"),
            trans: this.gl.getUniformLocation(prog, "u_transition"),
            cm: this.gl.getUniformLocation(prog, "u_currMode"),
            nm: this.gl.getUniformLocation(prog, "u_nextMode")
        };
    }

    triggerTransition() {
        this.state.currMode = this.state.nextMode;
        this.state.nextMode = (this.state.currMode + 1) % 3;
        this.state.transition = 0.0;
        const names = ["PRISM_VOID", "KINETIC_CUBES", "SPECTRAL_LATTICE"];
        document.getElementById('mode-display').innerText = "SCENE: " + names[this.state.nextMode];
    }

    async initAudio(type) {
        this.ctx = new AudioContext();
        this.analyser = this.ctx.createAnalyser();
        if(type === 'mic') {
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            this.ctx.createMediaStreamSource(s).connect(this.analyser);
            document.getElementById('track-display').innerText = "LIVE_MIC";
        } else {
            const file = document.getElementById('fileInput').files[0];
            this.audio = new Audio(URL.createObjectURL(file));
            this.ctx.createMediaElementSource(this.audio).connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
            this.audio.play();
            document.getElementById('track-display').innerText = file.name.slice(0,12).toUpperCase();
        }
        document.getElementById('landing').style.opacity = "0";
        setTimeout(() => document.getElementById('landing').style.display = "none", 1000);
    }

    toggleUI() { document.getElementById('controller').classList.toggle('minimized'); }
    togglePlayback() {
        if(!this.audio) return;
        if(this.audio.paused) { this.audio.play(); document.getElementById('pause-btn').innerText="PAUSE"; }
        else { this.audio.pause(); document.getElementById('pause-btn').innerText="PLAY"; }
    }

    resize() {
        this.canvas.width = window.innerWidth * window.devicePixelRatio;
        this.canvas.height = window.innerHeight * window.devicePixelRatio;
        this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    }

    bindEvents() {
        window.addEventListener('resize', () => this.resize());
        document.getElementById('fileInput').onchange = () => this.initAudio('file');
    }

    render() {
        if(this.analyser) {
            const d = new Uint8Array(this.analyser.frequencyBinCount);
            this.analyser.getByteFrequencyData(d);
            let b=0, m=0, h=0;
            for(let i=0; i<12; i++) b += d[i];
            for(let i=12; i<100; i++) m += d[i];
            for(let i=100; i<250; i++) h += d[i];
            const prevB = this.state.bass;
            this.state.bass = b/3060; this.state.mid = m/22440; this.state.high = h/38250;
            if(this.state.bass > prevB * 1.15) this.state.beat = 1.0;
            this.state.beat *= 0.94;
        }
        if(this.state.transition < 1.0) this.state.transition += 0.008;
        const time = (Date.now() - this.state.startTime) * 0.001;
        this.gl.uniform1f(this.uni.t, time);
        this.gl.uniform2f(this.uni.r, this.canvas.width, this.canvas.height);
        this.gl.uniform1f(this.uni.b, this.state.bass);
        this.gl.uniform1f(this.uni.m, this.state.mid);
        this.gl.uniform1f(this.uni.h, this.state.high);
        this.gl.uniform1f(this.uni.bt, this.state.beat);
        this.gl.uniform1f(this.uni.trans, this.state.transition);
        this.gl.uniform1i(this.uni.cm, this.state.currMode);
        this.gl.uniform1i(this.uni.nm, this.state.nextMode);
        this.gl.drawArrays(this.gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(this.render);
    }
}
const app = new VJSystem();
</script>
</body>
</html>
