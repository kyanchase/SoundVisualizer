<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synesthesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2fe; --panel: rgba(10, 10, 10, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'DM Sans', sans-serif;
            color: white;
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; }

        /* Subtle Fading Multicolor Background */
        #landing {
            position: fixed; inset: 0; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
            background: linear-gradient(-45deg, #050505, #1a0a1a, #0a1a1a, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: 100;
            transition: opacity 1.5s ease; 
            pointer-events: all;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title {
            font-family: 'Space Mono';
            font-size: 4.5vw;
            letter-spacing: .3em;
            margin-bottom: 50px;
            text-transform: uppercase;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .cards { display: flex; gap: 40px; }

        /* Marble Button Styling */
        .card {
            width: 220px; height: 140px;
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Marble Background Simulation */
            background: linear-gradient(135deg, #e0e0e0 0%, #ffffff 50%, #d1d1d1 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.5);
            color: #333;
            font-family: 'Space Mono';
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
        }

        .card span { font-size: 2.5rem; margin-bottom: 10px; }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,242,254,0.3);
            filter: brightness(1.1);
        }

        /* Controller - Starts Minimized */
        #controller {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--panel); border: 1px solid #333; border-radius: 50px;
            display: flex; align-items: center; padding: 0; gap: 0;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: all; backdrop-filter: blur(20px);
            width: 60px; height: 60px; overflow: hidden; justify-content: center;
        }

        #controller.expanded { width: 280px; padding: 12px 30px; gap: 25px; border-radius: 50px; }

        .status-dot {
            width: 20px; height: 20px; background: var(--accent); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 20px var(--accent); flex-shrink: 0;
        }

        .hide-on-min { opacity: 0; display: none; transition: opacity 0.3s; }
        #controller.expanded .hide-on-min { opacity: 1; display: block; }

        #pause-btn {
            background: white; border: none; color: black; cursor: pointer;
            padding: 8px 18px; border-radius: 20px; font-family: 'Space Mono';
            font-size: 10px; font-weight: 700; text-transform: uppercase;
        }

        .info-text { font-family: 'Space Mono'; font-size: 10px; color: #888; white-space: nowrap; }
        #fileInput { display: none; }
    </style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui-layer">
    <div id="landing">
        <div class="title">Synesthesia</div>
        <div class="cards">
            <div class="card" onclick="app.initAudio('mic')">
                <span>🎙️</span>Microphone
            </div>
            <div class="card" onclick="document.getElementById('fileInput').click()">
                <span>🎵</span>Upload Track
            </div>
        </div>
    </div>

    <div id="controller">
        <div class="status-dot" onclick="app.toggleUI()"></div>
        <div class="hide-on-min info-text" id="track-display">OFFLINE</div>
        <button class="hide-on-min" id="pause-btn" onclick="app.togglePlayback()">Pause</button>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/*">

<script id="vs" type="x-shader/x-vertex">
    attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }
</script>

<script id="fs" type="x-shader/x-fragment">
    precision highp float;
    uniform float u_time, u_bass, u_mid, u_high, u_beat, u_transition;
    uniform int u_currMode, u_nextMode;
    uniform vec2 u_res;

    mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

    vec3 spectral(float t) {
        vec3 a = vec3(0.5); vec3 b = vec3(0.5); vec3 c = vec3(1.0);
        vec3 d = vec3(0.0, 0.33, 0.67);
        return a + b * cos(6.28318 * (c * t + d));
    }

    float sdOctahedron(vec3 p, float s) {
        p = abs(p); return (p.x + p.y + p.z - s) * 0.57735027;
    }

    float map(vec3 p, int mode) {
        float d = 1000.0;
        if (mode == 0) { // PRISM VOID
            p.z += u_time * 0.8;
            p.xy *= rot(p.z * 0.1 + u_time * 0.05);
            vec3 q = mod(p, 10.0) - 5.0; // Increased spacing to reduce wash
            for(int i=0; i<4; i++) {
                q = abs(q) - 1.5;
                q.xz *= rot(u_time * 0.2 + u_bass * 0.1);
                q *= 1.25;
            }
            d = sdOctahedron(q, 1.2 + u_bass) * 0.1;
        } 
        else if (mode == 1) { // KINETIC CUBES
            p.xz *= rot(u_time * 0.3);
            p.yz *= rot(u_time * 0.2);
            vec3 q = mod(p, 8.0) - 4.0; 
            vec3 id = floor(p/8.0);
            q.xy *= rot(u_time * 0.5 + length(id) * 0.1);
            d = (length(max(abs(q)-vec3(0.7 + u_bass * 0.5), 0.0)));
        }
        else { // SPECTRAL LATTICE
            p.z += u_time * 0.6;
            p.xy *= rot(sin(u_time * 0.1));
            vec3 q = abs(mod(p, 4.0) - 2.0);
            for(int i=0; i<3; i++) {
                q = abs(q) - 0.5;
                q.xy *= rot(u_time * 0.3);
                q *= 1.5 + u_bass * 0.1;
            }
            d = length(q.xz) - (0.15 + u_mid * 0.5);
        }
        return d;
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - u_res.xy) / min(u_res.x, u_res.y);
        vec3 ro = vec3(0, 0, -7);
        vec3 rd = normalize(vec3(uv, 1.2));
        
        float t = 0.0;
        for(int i=0; i<100; i++) {
            vec3 p = ro + rd * t;
            float dist = mix(map(p, u_currMode), map(p, u_nextMode), u_transition);
            if(abs(dist) < 0.002 || t > 50.0) break;
            t += dist;
        }

        vec3 col = vec3(0);
        if(t < 50.0) {
            float grad = t * 0.04 + u_time * 0.05;
            col = spectral(grad);
            
            // Reduced washed out intensity
            col *= exp(-t * 0.12); 
            col += (u_high * 0.15) / (t * 0.5); // Softer glimmer
        }
        
        // Final Contrast adjustment to prevent "washed out" look
        col = pow(col, vec3(1.2)); 
        col *= 1.2;
        
        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
</script>

<script>
class VJSystem {
    constructor() {
        this.canvas = document.getElementById('gl');
        this.gl = this.canvas.getContext('webgl');
        this.state = { 
            bass:0, mid:0, high:0, beat:0, 
            currMode: 0, nextMode: 0, transition: 1.0,
            elapsedTime: 0, lastFrameTime: Date.now(),
            isPaused: false
        };
        this.initGL();
        this.bindEvents();
        this.resize();
        this.render = this.render.bind(this);
        requestAnimationFrame(this.render);
        setInterval(() => this.triggerTransition(), 12000);
    }

    initGL() {
        const prog = this.gl.createProgram();
        const compile = (t, s) => {
            const sh = this.gl.createShader(t);
            this.gl.shaderSource(sh, s);
            this.gl.compileShader(sh);
            this.gl.attachShader(prog, sh);
        };
        compile(this.gl.VERTEX_SHADER, document.getElementById('vs').text);
        compile(this.gl.FRAGMENT_SHADER, document.getElementById('fs').text);
        this.gl.linkProgram(prog);
        this.gl.useProgram(prog);
        this.prog = prog;

        this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.gl.createBuffer());
        this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), this.gl.STATIC_DRAW);
        const p = this.gl.getAttribLocation(prog, "pos");
        this.gl.enableVertexAttribArray(p);
        this.gl.vertexAttribPointer(p, 2, this.gl.FLOAT, false, 0, 0);

        this.uni = {
            t: this.gl.getUniformLocation(prog, "u_time"),
            r: this.gl.getUniformLocation(prog, "u_res"),
            b: this.gl.getUniformLocation(prog, "u_bass"),
            m: this.gl.getUniformLocation(prog, "u_mid"),
            h: this.gl.getUniformLocation(prog, "u_high"),
            bt: this.gl.getUniformLocation(prog, "u_beat"),
            trans: this.gl.getUniformLocation(prog, "u_transition"),
            cm: this.gl.getUniformLocation(prog, "u_currMode"),
            nm: this.gl.getUniformLocation(prog, "u_nextMode")
        };
    }

    triggerTransition() {
        if (this.state.isPaused) return;
        this.state.currMode = this.state.nextMode;
        this.state.nextMode = (this.state.currMode + 1) % 3;
        this.state.transition = 0.0;
    }

    async initAudio(type) {
        this.ctx = new AudioContext();
        this.analyser = this.ctx.createAnalyser();
        if(type === 'mic') {
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            this.ctx.createMediaStreamSource(s).connect(this.analyser);
            document.getElementById('track-display').innerText = "LIVE_MIC";
        } else {
            const file = document.getElementById('fileInput').files[0];
            this.audio = new Audio(URL.createObjectURL(file));
            this.ctx.createMediaElementSource(this.audio).connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
            this.audio.play();
            document.getElementById('track-display').innerText = file.name.slice(0,10).toUpperCase();
        }
        document.getElementById('landing').style.opacity = "0";
        setTimeout(() => document.getElementById('landing').style.display = "none", 1500);
    }

    toggleUI() { document.getElementById('controller').classList.toggle('expanded'); }
    
    togglePlayback() {
        this.state.isPaused = !this.state.isPaused;
        document.getElementById('pause-btn').innerText = this.state.isPaused ? "Play" : "Pause";
        if (this.audio) {
            this.state.isPaused ? this.audio.pause() : this.audio.play();
        }
    }

    resize() {
        this.canvas.width = window.innerWidth * window.devicePixelRatio;
        this.canvas.height = window.innerHeight * window.devicePixelRatio;
        this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    }

    bindEvents() {
        window.addEventListener('resize', () => this.resize());
        document.getElementById('fileInput').onchange = () => this.initAudio('file');
    }

    render() {
        const now = Date.now();
        const delta = (now - this.state.lastFrameTime) * 0.001;
        this.state.lastFrameTime = now;

        if (!this.state.isPaused) {
            this.state.elapsedTime += delta;
            
            if(this.analyser) {
                const d = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(d);
                let b=0, m=0, h=0;
                for(let i=0; i<12; i++) b += d[i];
                for(let i=12; i<100; i++) m += d[i];
                for(let i=100; i<250; i++) h += d[i];
                const prevB = this.state.bass;
                this.state.bass = b/3060; this.state.mid = m/22440; this.state.high = h/38250;
                if(this.state.bass > prevB * 1.15) this.state.beat = 1.0;
                this.state.beat *= 0.94;
            }
            if(this.state.transition < 1.0) this.state.transition += 0.006;
        }

        this.gl.uniform1f(this.uni.t, this.state.elapsedTime);
        this.gl.uniform2f(this.uni.r, this.canvas.width, this.canvas.height);
        this.gl.uniform1f(this.uni.b, this.state.bass);
        this.gl.uniform1f(this.uni.m, this.state.mid);
        this.gl.uniform1f(this.uni.h, this.state.high);
        this.gl.uniform1f(this.uni.bt, this.state.beat);
        this.gl.uniform1f(this.uni.trans, this.state.transition);
        this.gl.uniform1i(this.uni.cm, this.state.currMode);
        this.gl.uniform1i(this.uni.nm, this.state.nextMode);
        this.gl.drawArrays(this.gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(this.render);
    }
}
const app = new VJSystem();
</script>
</body>
</html>
